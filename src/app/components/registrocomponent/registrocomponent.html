<div class="container py-5">
  <div class="card shadow-sm mx-auto auth-card">
    <div class="card-body p-4">
      <h1 class="h3 fw-bold mb-1">
        <i class="fa-solid fa-user-plus me-2" aria-hidden="true"></i>Crear cuenta
      </h1>
      <p class="text-body-secondary">Las cuentas nuevas se crean con rol USER.</p>

      @if (error()) {
        <div class="alert alert-danger" role="alert">
          <i class="fa-solid fa-circle-exclamation me-2" aria-hidden="true"></i>{{ error() }}
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <div class="mb-3">
          <label for="registro-username" class="form-label">Usuario</label>
          <input
            id="registro-username"
            class="form-control"
            formControlName="username"
            autocomplete="username"
            [class.is-invalid]="form.controls.username.touched && form.controls.username.invalid"
          />
          <div class="invalid-feedback">El usuario es obligatorio (máximo 50 caracteres).</div>
        </div>
        <div class="mb-3">
          <label for="registro-password" class="form-label">Contraseña</label>
          <input
            id="registro-password"
            type="password"
            class="form-control"
            formControlName="password"
            autocomplete="new-password"
            aria-describedby="registro-password-ayuda"
            [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"
          />
          <div id="registro-password-ayuda" class="form-text">Mínimo 8 caracteres.</div>
          <div class="invalid-feedback">La contraseña debe tener al menos 8 caracteres.</div>
        </div>
        <div class="mb-3">
          <label for="registro-confirmar" class="form-label">Confirmar contraseña</label>
          <input
            id="registro-confirmar"
            type="password"
            class="form-control"
            formControlName="confirmar"
            autocomplete="new-password"
            [class.is-invalid]="
              form.controls.confirmar.touched &&
              (form.controls.confirmar.invalid || form.hasError('noCoinciden'))
            "
          />
          <div class="invalid-feedback">Las contraseñas no coinciden.</div>
        </div>
        <button type="submit" class="btn btn-primary w-100" [disabled]="cargando()">
          @if (cargando()) {
            <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
            Registrando…
          } @else {
            Registrarme
          }
        </button>
      </form>

      <p class="mt-3 mb-0 text-center">
        ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
      </p>
    </div>
  </div>
</div>
