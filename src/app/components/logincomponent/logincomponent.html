<div class="container py-5">
  <div class="card shadow-sm mx-auto auth-card">
    <div class="card-body p-4">
      <h1 class="h3 fw-bold mb-1">
        <i class="fa-solid fa-right-to-bracket me-2" aria-hidden="true"></i>Iniciar sesión
      </h1>
      <p class="text-body-secondary">Ingresa con tu cuenta del back Spring (JWT).</p>

      @if (aviso()) {
        <div class="alert alert-info" role="status">{{ aviso() }}</div>
      }
      @if (error()) {
        <div class="alert alert-danger" role="alert">
          <i class="fa-solid fa-circle-exclamation me-2" aria-hidden="true"></i>{{ error() }}
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <div class="mb-3">
          <label for="login-username" class="form-label">Usuario</label>
          <input
            id="login-username"
            class="form-control"
            formControlName="username"
            autocomplete="username"
            [class.is-invalid]="form.controls.username.touched && form.controls.username.invalid"
          />
          <div class="invalid-feedback">El usuario es obligatorio.</div>
        </div>
        <div class="mb-3">
          <label for="login-password" class="form-label">Contraseña</label>
          <input
            id="login-password"
            type="password"
            class="form-control"
            formControlName="password"
            autocomplete="current-password"
            [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"
          />
          <div class="invalid-feedback">La contraseña es obligatoria.</div>
        </div>
        <button type="submit" class="btn btn-primary w-100" [disabled]="cargando()">
          @if (cargando()) {
            <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
            Ingresando…
          } @else {
            Ingresar
          }
        </button>
      </form>

      <p class="mt-3 mb-0 text-center">
        ¿No tienes cuenta? <a routerLink="/registro">Regístrate</a>
      </p>
    </div>
  </div>
</div>
